[project]
name = "gemini-writing-eval"
version = "1.0.0"
description = "Gemini Writing Evaluation Framework - comparing Gemini 3.0 Pro/Flash against competing frontier LLMs on realistic professional writing tasks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gemini Writing Eval Team"}
]

dependencies = [
    # Core async framework
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "aiofiles>=23.2",
    "tenacity>=8.2",
    "anyio>=4.2",

    # CLI and TUI
    "typer[all]>=0.9",
    "rich>=13.7",
    "textual>=0.52",

    # Data analysis
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",

    # Visualization and reporting
    "plotly>=5.18",
    "kaleido>=0.2,<0.3",
    "weasyprint>=61",
    "jinja2>=3.1",

    # Token counting
    "tiktoken>=0.5",

    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.2",
    "types-aiofiles",
    "respx>=0.21",
]

[project.scripts]
gemini-eval = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/tui/*",  # TUI is hard to test automatically
    "src/cli.py",  # CLI is mostly I/O, tested via integration
    "src/eval/engine.py",  # Engine is mostly I/O orchestration, tested via integration
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
